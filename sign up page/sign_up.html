<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

</head>
<body>
    <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CashBeeBank - Create Account</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="sign_up.css" />
</head>
<body>
  <div class="container-fluid vh-100 ">
    <div class="row h-100">
      <!-- Left Side -->
      <div class="col-md-6 d-none d-md-flex flex-column justify-content-center align-items-center text-white left-panel">
        <div class="text-center">
          <i class="bi bi-bank fs-1 mb-3"></i>
          <h2>CashBeeBank</h2>
          <p>Your Financial Partner</p>
          <ul class="list-unstyled mt-4">
            <li class="mb-2"><i class="bi bi-shield-lock me-2"></i>Bank-grade security</li>
            <li class="mb-2"><i class="bi bi-phone me-2"></i>24/7 mobile access</li>
            <li><i class="bi bi-graph-up me-2"></i>Smart financial insights</li>
          </ul>
        </div>
      </div>

      <!-- Right Side -->
      <div class="col-md-6 d-flex justify-content-center align-items-center bg-tertiary">
        <div class="card p-5 shadow-sm form-card">
          <h4 class="text-center mb-3 fw-bold">Create Account</h4>
          <p class="text-center text-muted">Join CashbeeBank today</p>
          <div id="errorMessage" class="alert alert-danger text-center mb-3" style="display: none;">Please Fill in all inputs</div>
          <div id="newError" class="alert alert-danger" style="display: none;" >Email Already in use</div>
           <div id="errorAnother" class="alert alert-danger" style="display: none;" >Enter a Valid Email Address</div>
          <div id="thirdError" class="alert alert-danger" style="display: none;" ></div> 
          <div id="error4" class="alert alert-danger" style="display: none;" ></div> 



         
  

          <form>
            <div class="row mb-3">
              <div class="col">
                <input type="text" id="firstName" class="form-control" placeholder="First Name" required />
              </div>
              <div class="col">
                <input type="text" id="lastName" class="form-control" placeholder="Last Name" required />
              </div>
            </div>
             <div class="mb-3 input-group">
              <span class="input-group-text bg-white"><i class="bi bi-phone"></i></span>
              <input type="number" id="phoneNum" class="form-control" placeholder="Phone Number" required />
            </div>

            <div class="mb-3 input-group">
              <span class="input-group-text bg-white"><i class="bi bi-envelope"></i></span>
              <input type="email" id="email" class="form-control" placeholder="Email Address" required />
            </div>

          

            <div class="mb-3 input-group">
              <span class="input-group-text bg-white"><i class="bi bi-lock"></i></span>
              <input type="password" id="password" class="form-control" placeholder="Create a strong password" required />
            </div>


            <div class="mb-3">
              <label class="form-check-label" for="terms">
                I agree to the <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a>
              </label>
            </div>
            <div class="text-center mt-3">
              <p class="mb-0">Already have an account? <a href="../signin_page/signin.html">Sign in</a></p>
            </div>
          </form>
           <button type="button" class="btn btn-primary w-100" onclick="createAccount()">Create Account</button>

        </div>
      </div>
    </div>
  </div>
  <script type="module" src="sign_up.js"></script>

  
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

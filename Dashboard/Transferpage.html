<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NairaBank - Transfer</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

  <style>
    :root {
      --primary: #0a46ff;
      --card-bg: #ffffff;
      --text-color: #222;
      --soft-bg: #f5f7fb;
      --transition: 0.3s ease;
    }

    body {
      background: var(--soft-bg);
      color: var(--text-color);
      transition: var(--transition);
    }

    .card-custom {
      border-radius: 14px;
      background: var(--card-bg);
      padding: 25px;
      transition: var(--transition);
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
      animation: fadeIn 0.6s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px);} 
      to { opacity: 1; transform: translateY(0);} 
    }

    .btn-submit {
      background: var(--primary);
      color: #fff;
      border-radius: 10px;
      padding: 12px 20px;
      transition: var(--transition);
      font-size: 17px;
      font-weight: 600;
    }

    .btn-submit:hover { opacity: 0.85; }

    .input-group-text {
      background: #eef2ff;
      border: none;
      font-weight: bold;
      color: var(--primary);
    }

    .form-control { padding: 12px; }

    .back-btn {
      background: var(--primary);
      color: #fff;
      border-radius: 10px;
      padding: 10px 18px;
    }
  </style>
</head>
<body>

<div class="container py-5" style="max-width: 760px;">

  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="fw-bold">Send Money</h2>
    <a href="#" class="back-btn"><i class="fa-solid fa-arrow-left me-2"></i>Back</a>
  </div>

  <div class="card-custom mb-4">
    <h5 class="fw-bold mb-3">Transfer Details</h5>

    <div class="mb-3">
      <label class="form-label fw-semibold">Select Account</label>
      <select class="form-select p-3">
        <option>Primary Account (₦2,847,650.00)</option>
        <option>Savings Account (₦1,245,320.50)</option>
      </select>
    </div>

    <div class="mb-3">
      <label class="form-label fw-semibold">Recipient Bank</label>
      <select class="form-select p-3">
        <option>Access Bank</option>
        <option>GTBank</option>
        <option>First Bank</option>
        <option>Zenith Bank</option>
      </select>
    </div>

    <div class="mb-3">
      <label class="form-label fw-semibold">Account Number</label>
      <input type="text" class="form-control" placeholder="Enter account number" />
    </div>

    <div class="mb-3">
      <label class="form-label fw-semibold">Account Name</label>
      <input type="text" class="form-control" placeholder="Auto fetched..." disabled />
    </div>

    <div class="mb-3">
      <label class="form-label fw-semibold">Amount</label>
      <div class="input-group">
        <span class="input-group-text">₦</span>
        <input type="number" class="form-control" placeholder="0.00" />
      </div>
    </div>

    <div class="mb-3">
      <label class="form-label fw-semibold">Description (Optional)</label>
      <input type="text" class="form-control" placeholder="e.g Transport, Bills..." />
    </div>

    <button class="btn-submit w-100 mt-3"><i class="fa-solid fa-paper-plane me-2"></i>Send Money</button>
  </div>

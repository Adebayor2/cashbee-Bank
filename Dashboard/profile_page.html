<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NairaBank - Profile</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

  <style>
    :root {
      --primary: #0a46ff;
      --card-bg: #ffffff;
      --text-color: #222;
      --soft-bg: #f5f7fb;
      --transition: 0.3s ease;
    }

    body {
      background: var(--soft-bg);
      color: var(--text-color);
      transition: var(--transition);
    }

    .card-custom {
      border-radius: 14px;
      background: var(--card-bg);
      padding: 25px;
      transition: var(--transition);
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
      animation: fadeIn 0.6s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px);} 
      to { opacity: 1; transform: translateY(0);} 
    }

    .profile-pic {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      object-fit: cover;
      border: 4px solid var(--primary);
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    }

    .btn-edit {
      background: var(--primary);
      color: #fff;
      border-radius: 10px;
      padding: 10px 20px;
      transition: var(--transition);
    }
    .btn-edit:hover { opacity: 0.85; }

    .info-label {
      font-weight: 600;
      color: #555;
    }

    .value-box {
      background: #eef2ff;
      border-radius: 10px;
      padding: 10px 15px;
      font-weight: 500;
    }

  </style>
</head>
<body>

<div class="container py-5">

  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="fw-bold">Profile</h2>
    <a href="./Dashboard.html" class="btn btn-edit"><i class="fa-solid fa-arrow-left me-2"></i>Back to Dashboard</a>
  </div>

  <div class="card-custom mb-4 text-center">
    <!-- <img src="https://via.placeholder.com/150" alt="Profile" class="profile-pic mb-3" /> -->
     <div id="profilePic"></div>
        <div  id="show"></div>
    
    <p class="text-muted">Premium Member</p>
    <button class="btn btn-edit mt-2"><i class="fa-solid fa-pen-to-square me-2"></i>Edit Profile</button>
  </div>

  <div class="card-custom">
    <h5 class="fw-bold mb-3">Personal Information</h5>
    <div class="row g-3">
      <div class="col-md-6">
        <span class="info-label">Full Name</span>
        <div class="value-box" id="shown"></div>
      </div>

      <div class="col-md-6">
        <span class="info-label" >Email Address</span>
        <div class="value-box" id="showMail"></div>
      </div>

      <div class="col-md-6">
        <span class="info-label">Phone Number</span>
        <div class="value-box" id="pNum"></div>
      </div>

      <div class="col-md-6">
        <span class="info-label">Account Type</span>
        <div class="value-box">Premium</div>
      </div>

      <div class="col-md-6">
        <span class="info-label">Home Address</span>
        <div class="value-box">Null</div>
      </div>

      <div class="col-md-6">
        <span class="info-label">Member Since</span>
        <div class="value-box" id="member"></div>
      </div>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-auth.js";
   import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-database.js";
   const firebaseConfig = {
  apiKey: "AIzaSyD2pdUo-5GtiCHjv7vJVVP2h3UV2iaBqHg",
  authDomain: "cashbee-bank.firebaseapp.com",
  projectId: "cashbee-bank",
  storageBucket: "cashbee-bank.firebasestorage.app",
  messagingSenderId: "75477711466",
  appId: "1:75477711466:web:110ffedbcf917270496813",
  measurementId: "G-G40B1NRHWP"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);


const user = JSON.parse(localStorage.getItem('userInfo'));
    document.getElementById('pNum').innerText = `${user.phoneN}`;
  document.getElementById('shown').innerText = `${user.fname} ${user.sname}`;

  onAuthStateChanged(auth, (user) => {
  if (user) {

  console.log(user);

  // show.innerHTML += `<h2>Welcome ${user.displayName}</h2>`
//   shown.innerHTML += `<p> ${user.displayName}</p>`
//   show.innerHTML += `<h4> ${user.displayName}</h4>`
 showMail.innerHTML += `<p> ${user.email}</p>`
 member.innerHTML += `<p> ${user.metadata.creationTime}</p>`

 
   profilePic.innerHTML += `<img style="width:100px; height:80px; border-radius:50%;" src="${user.photoURL}" alt="User Photo" />`
  
  
    
  } else {

   setTimeout(() => {
            window.location.href = 'index.html';
          }, 1000);
    console.log("No user is signed in.");
  }
})

</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NairaBank - Profile</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

  <style>
    :root {
      --primary: #0a46ff;
      --card-bg: #ffffff;
      --text-color: #222;
      --soft-bg: #f5f7fb;
      --transition: 0.3s ease;
    }

    body {
      background: var(--soft-bg);
      color: var(--text-color);
      transition: var(--transition);
    }

    .card-custom {
      border-radius: 14px;
      background: var(--card-bg);
      padding: 25px;
      transition: var(--transition);
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
      animation: fadeIn 0.6s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px);} 
      to { opacity: 1; transform: translateY(0);} 
    }

    .profile-pic {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      object-fit: cover;
      border: 4px solid var(--primary);
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    }

    .btn-edit {
      background: var(--primary);
      color: #fff;
      border-radius: 10px;
      padding: 10px 20px;
      transition: var(--transition);
    }
    .btn-edit:hover { opacity: 0.85; }

    .info-label {
      font-weight: 600;
      color: #555;
    }

    .value-box {
      background: #eef2ff;
      border-radius: 10px;
      padding: 10px 15px;
      font-weight: 500;
    }

  </style>
</head>
<body>

<div class="container py-5">

  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="fw-bold">Profile</h2>
    <a href="./Dashboard.html" class="btn btn-edit"><i class="fa-solid fa-arrow-left me-2"></i>Back to Dashboard</a>
  </div>

  <div class="card-custom mb-4 text-center">
    <img src="https://via.placeholder.com/150" alt="Profile" class="profile-pic mb-3" />
    <h4 class="fw-bold mb-1">Adunni Okafor</h4>
    <p class="text-muted">Premium Member</p>
    <button class="btn btn-edit mt-2"><i class="fa-solid fa-pen-to-square me-2"></i>Edit Profile</button>
  </div>

  <div class="card-custom">
    <h5 class="fw-bold mb-3">Personal Information</h5>
    <div class="row g-3">
      <div class="col-md-6">
        <span class="info-label">Full Name</span>
        <div class="value-box">Adunni Okafor</div>
      </div>

      <div class="col-md-6">
        <span class="info-label">Email Address</span>
        <div class="value-box">adunniokafor@gmail.com</div>
      </div>

      <div class="col-md-6">
        <span class="info-label">Phone Number</span>
        <div class="value-box">+234 810 456 7892</div>
      </div>

      <div class="col-md-6">
        <span class="info-label">Account Type</span>
        <div class="value-box">Premium</div>
      </div>

      <div class="col-md-6">
        <span class="info-label">Home Address</span>
        <div class="value-box">12, Freedom Estate, Lagos</div>
      </div>

      <div class="col-md-6">
        <span class="info-label">Member Since</span>
        <div class="value-box">Jan 12, 2021</div>
      </div>
    </div>
  </div>
</div>

</body>
</html>

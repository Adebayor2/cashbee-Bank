<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings</title>

    <!-- BOOTSTRAP -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- BOOTSTRAP ICONS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        body {
            background: #f2f5f9;
            font-family: "Segoe UI", sans-serif;
        }

        /* Page Entrance Animation */
        .fade-slide {
            animation: fadeSlide .6s ease both;
        }

        @keyframes fadeSlide {
            from {
                opacity: 0;
                transform: translateY(25px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Card Styling */
        .settings-card {
            background: #fff;
            border-radius: 16px;
            padding: 25px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.06);
        }

        .section-title {
            font-size: 15px;
            text-transform: uppercase;
            font-weight: 600;
            color: #6c757d;
            margin-top: 20px;
            margin-bottom: 10px;
        }

        /* Settings Rows */
        .setting-row {
            padding: 12px 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #eef0f3;
            cursor: pointer;
            transition: 0.2s ease;
        }

        .setting-row:last-child {
            border-bottom: none;
        }

        .setting-row:hover {
            background: #f8fafc;
            padding-left: 6px;
        }

        .setting-icon {
            font-size: 1.4rem;
            width: 40px;
            height: 40px;
            background: #eef1f6;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            margin-right: 12px;
            color: #0d6efd;
        }

        .setting-label {
            font-size: 15px;
            font-weight: 600;
        }

        .arrow-icon {
            font-size: 1.1rem;
            color: #adb5bd;
        }

        /* Logout */
        .logout-row {
            color: #dc3545 !important;
        }

        .logout-row .setting-icon {
            background: #ffe8e8 !important;
            color: #dc3545 !important;
        }

        .btn-back {
            border-radius: 30px;
            padding: 8px 18px;
        }
    </style>
</head>

<body>

    <div class="container py-4 fade-slide">

        <!-- Header -->
        <div class="d-flex align-items-center mb-4">
            <button class="btn btn-primary  me-3">
                <i class="bi bi-arrow-left"></i>
                <a href="./Dashboard.html" class="text-decoration-none text-light">Back</a>
            </button>
            <h2 class="fw-bold m-0">Settings</h2>
        </div>

        <!-- SETTINGS CARD -->
        <div class="settings-card">

            <!-- ACCOUNT SECTION -->
            <div class="section-title">Account</div>

            <div class="setting-row">
                <div class="d-flex align-items-center">
                    <div class="setting-icon"><i class="bi bi-person"></i></div>
                    <span class="setting-label"><a href="../Dashboard/profile_page.html"
                            class="text-dark text-decoration-none">Profile Information</a></span>
                </div>
                <i class="bi bi-chevron-right arrow-icon"></i>
            </div>

            <div class="setting-row">
                <div class="d-flex align-items-center">
                    <div class="setting-icon"><i class="bi bi-envelope"></i></div>
                    <span class="setting-label">Change Email</span>
                </div>
                <i class="bi bi-chevron-right arrow-icon"></i>
            </div>

            <div class="setting-row">
                <div class="d-flex align-items-center">
                    <div class="setting-icon"><i class="bi bi-key"></i></div>
                    <span class="setting-label">Change Password</span>
                </div>
                <i class="bi bi-chevron-right arrow-icon"></i>
            </div>

            <!-- APP PREFERENCES -->
            <div class="section-title">App Preferences</div>

            <div class="setting-row">
                <div class="d-flex align-items-center">
                    <div class="setting-icon"><i class="bi bi-bell"></i></div>
                    <span class="setting-label">Notifications</span>
                </div>
                <i class="bi bi-chevron-right arrow-icon"></i>
            </div>

            <div class="setting-row">
                <div class="d-flex align-items-center">
                    <div class="setting-icon"><i class="bi bi-sliders"></i></div>
                    <span class="setting-label">Preferences</span>
                </div>
                <i class="bi bi-chevron-right arrow-icon"></i>
            </div>

            <!-- SECURITY -->
            <div class="section-title">Security</div>

            <div class="setting-row">
                <div class="d-flex align-items-center">
                    <div class="setting-icon"><i class="bi bi-shield-lock"></i></div>
                    <span class="setting-label">Two-Factor Authentication</span>
                </div>
                <i class="bi bi-chevron-right arrow-icon"></i>
            </div>

            <!-- LOGOUT -->
            <div class="setting-row logout-row">
                <div class="d-flex align-items-center">
                    <div class="setting-icon"><i class="bi bi-box-arrow-right"></i></div>
                    <button style="border: none; background-color: transparent;" onclick="logOut()"> <span class="setting-label">Logout</span> </button>
                </div>
            </div>

        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-auth.js";
        import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-database.js";
        const firebaseConfig = {
            apiKey: "AIzaSyD2pdUo-5GtiCHjv7vJVVP2h3UV2iaBqHg",
            authDomain: "cashbee-bank.firebaseapp.com",
            projectId: "cashbee-bank",
            storageBucket: "cashbee-bank.firebasestorage.app",
            messagingSenderId: "75477711466",
            appId: "1:75477711466:web:110ffedbcf917270496813",
            measurementId: "G-G40B1NRHWP"
        };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const logOut = () => {
            signOut(auth).then(() => {
                console.log("Sign-out successful.");
                setTimeout(() => {
                    window.location.href = '../index.html';
                }, 1000);

            }).catch((error) => {
                console.log("An error happened.");
            });
        }

        window.logOut = logOut;


    </script>
</body>

</html>
